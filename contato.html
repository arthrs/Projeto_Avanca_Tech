<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Restaurante Carga Pesada</title>
    <link rel="icon" type="image/png" href="./img/comida1.png">
    <!-- Font Awesome para os ícones do Footer -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="banner-topo">
        <img src="./img/topoImagem.jpeg" alt="Banner do Topo">
    </div>
    <div class="container-titulo">
        <h1 class="tituloPrincipal"><b>Restaurante Carga Pesada</b></h1>
        <marquee class="bichos">🐂🐔🫎🫕🍲🥘🍥🍖🥩🍗</marquee>
    </div>
    <nav class="menu-container">
        <a href="index.html" class="btn-3d">
            <span>Home</span>
            <span>Home</span>
        </a>
        <a href="#prato1" class="btn-3d">
            <span>Galeria</span>
            <span>Galeria</span>
        </a>
        <a href="contato.html" class="btn-3d">
            <span>Contato</span>
            <span>Contato</span>
        </a>
    </nav>

    <div class="box">
        <!-- O GIF substitui todo o bloco de textos antigo -->
        <img src="/img/bemvindo.gif" alt="Seja bem-vindo ao restaurante" class="welcome-gif">
    </div>
    <div class="box">
        <div class="inner">
            <span>Seja bem-vindo ao restaurante</span>
        </div>
        <br>
        <div class="inner">
            <span>Vá com Deus</span>
        </div>


        <div class="text-center">
            <h1>Inovação e Dedicação</h1>
            <hr>
            <h2 class="galeria-animada"> <!--Galeria animada para carregar letras da direita para a esquerda-->
                <span>N</span><span>o</span><span>s</span><span>s</span><span>a</span><span class="espaco"></span>
                <span>G</span><span>a</span><span>l</span><span>e</span><span>r</span><span>i</span><span>a</span><span
                    class="espaco"></span>
                <span>d</span><span>e</span><span class="espaco"></span>
                <span>R</span><span>e</span><span>f</span><span>e</span><span>i</span><span>ç</span><span>õ</span><span>e</span><span>s</span>
            </h2>
        </div>

        <!-- forms -->
        <!-- Seção do Formulário de Contato -->
        <section class="contato-container">
            <h2 class="titulo-principal">Faça seu Pedido</h2>
            <form class="form-contato">

                <!-- Campo Único: Nome -->
                <div class="input-group">
                    <input type="text" placeholder="Nome Completo" required>
                </div>

                <!-- Linha 1: CEP (Menor) e Endereço (Maior) -->
                <div class="input-row">
                    <div class="flex-1">
                        <input type="text" placeholder="CEP">
                    </div>
                    <div class="flex-3">
                        <input type="text" placeholder="Endereço">
                    </div>
                </div>

                <!-- Linha 2: Número e Complemento -->
                <div class="input-row">
                    <div class="flex-1">
                        <input type="text" placeholder="Número">
                    </div>
                    <div class="flex-2">
                        <input type="text" placeholder="Complemento">
                    </div>
                </div>

                <!-- Linha 3: Bairro, Cidade e Estado -->
                <div class="input-row">
                    <div class="flex-1">
                        <input type="text" placeholder="Bairro">
                    </div>
                    <div class="flex-1">
                        <input type="text" placeholder="Cidade">
                    </div>
                    <div class="flex-1">
                        <input type="text" placeholder="Estado">
                    </div>
                </div>

                <!-- Observação -->
                <div class="input-group">
                    <textarea placeholder="Observações (Ex: Sem cebola, troco para R$ 50...)" rows="4"></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Pedido</button>
            </form>
        </section>

        <!-- FOOTER ADAPTADO -->
        <footer class="social-footer">
            <ul class="social-icons">
                <li>
                    <a href="#"><i class="fab fa-facebook-f icon"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fab fa-twitter icon"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fab fa-linkedin-in icon"></i></a>
                </li>
                <li>
                    <a href="#"><i class="fab fa-google-plus-g icon"></i></a>
                </li>
            </ul>
        </footer>

        <!-- Inicio do corpo da página -->

        ... <!-- Conteúdo da página -->

        <div vw class="enabled">
            <div vw-access-button class="active"></div>
            <div vw-plugin-wrapper>
                <div class="vw-plugin-top-wrapper"></div>
            </div>
        </div>
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
        <script>
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        </script>
        <!-- Fim do corpo da página -->

        <!-- FUMAÇA DA ESQUERDA -->
        <!-- O GIF parado no rodapé real -->
        <div class="smoke-generator left">
            <img src="/img/grelha.gif" alt="Base" class="smoke-source">
        </div>
        <!-- As nuvens subindo até o topo da tela -->
        <div class="smoke-container left">
            <div class="smoke-cloud s1"></div>
            <div class="smoke-cloud s2"></div>
            <div class="smoke-cloud s3"></div>
        </div>

        <!-- FUMAÇA DA DIREITA -->
        <!-- O GIF parado no rodapé real -->
        <div class="smoke-generator right">
            <img src="/img/grelha.gif" alt="Base" class="smoke-source">
        </div>
        <!-- As nuvens subindo até o topo da tela -->
        <div class="smoke-container right">
            <div class="smoke-cloud s1"></div>
            <div class="smoke-cloud s2"></div>
            <div class="smoke-cloud s3"></div>
        </div>
</body>

</html>
